<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="100%" role="img" aria-labelledby="ttl desc">
  <title id="ttl">실행 구간(EXEC_STEPS) 앞 10 vs 40 비교</title>
  <desc id="desc">50스텝 액션 청크에서 EXEC_STEPS=10이면 앞 reach 구간만 반복 실행되어 같은 자리에 고착되고, EXEC_STEPS=40이면 한 청크로 reach·grasp·lift를 끝까지 실행한다는 비교 그림.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="510" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="24" y="36" font-size="21" font-weight="700" fill="#0f172a" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">실행 구간(EXEC_STEPS): 앞 10만 vs 40</text>
  <text x="24" y="58" font-size="13" fill="#64748b" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">막대 1개 = 정책이 한 번에 내놓는 50스텝 액션 청크</text>

  <!-- ===== BEFORE: EXEC_STEPS = 10 ===== -->
  <text x="24" y="88" font-size="15" font-weight="700" fill="#1e293b" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">before — EXEC_STEPS = 10</text>

  <text x="210" y="104" font-size="12" fill="#2563eb" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">실행: 앞 10칸</text>
  <path d="M150 110 L150 106 L270 106 L270 110" fill="none" stroke="#2563eb" stroke-width="1.5"/>

  <!-- chunk bands -->
  <rect x="150" y="114" width="120" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="270" y="114" width="252" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="522" y="114" width="228" height="40" rx="10" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <!-- cell ticks -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.4">
    <line x1="210" y1="114" x2="210" y2="122"/>
    <line x1="330" y1="114" x2="330" y2="122"/>
    <line x1="390" y1="114" x2="390" y2="122"/>
    <line x1="450" y1="114" x2="450" y2="122"/>
    <line x1="510" y1="114" x2="510" y2="122"/>
    <line x1="570" y1="114" x2="570" y2="122"/>
    <line x1="690" y1="114" x2="690" y2="122"/>
  </g>
  <text x="210" y="139" font-size="13" fill="#1e3a8a" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">reach</text>
  <text x="396" y="139" font-size="13" fill="#166534" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">grasp</text>
  <text x="636" y="139" font-size="13" fill="#ffffff" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">lift</text>

  <!-- dim non-executed -->
  <rect x="270" y="114" width="480" height="40" rx="10" fill="#94a3b8" opacity="0.42"/>
  <text x="510" y="139" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">실행 안 됨</text>

  <!-- cut marker + scale -->
  <line x1="270" y1="108" x2="270" y2="160" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="150" y="170" font-size="11" fill="#64748b" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">0</text>
  <text x="270" y="170" font-size="11" fill="#64748b" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">10</text>
  <text x="750" y="170" font-size="11" fill="#64748b" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">50</text>

  <!-- loop back arrow -->
  <path d="M268 158 C 268 206, 152 206, 152 162" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="210" y="226" font-size="12" fill="#dc2626" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">10칸 실행 → 재추론</text>

  <!-- red callout -->
  <rect x="300" y="164" width="430" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="318" y="190" font-size="13" fill="#b91c1c" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">같은 reach 자세 재입력 → 또 reach 예측</text>
  <text x="318" y="212" font-size="13" fill="#b91c1c" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">→ reach 어트랙터에 고착 (앞부분만 반복)</text>

  <!-- before result -->
  <rect x="24" y="242" width="832" height="38" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="44" y="266" font-size="14" font-weight="600" fill="#b91c1c" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">결과: shoulder_lift  -82.5° → -14.2°  (팔 못 듦)</text>

  <line x1="24" y1="298" x2="856" y2="298" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ===== AFTER: EXEC_STEPS = 40 ===== -->
  <text x="24" y="320" font-size="15" font-weight="700" fill="#1e293b" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">after — EXEC_STEPS = 40</text>

  <text x="390" y="338" font-size="12" fill="#16a34a" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">실행: 앞 40칸 (거의 full open-loop)</text>
  <path d="M150 344 L150 340 L630 340 L630 344" fill="none" stroke="#16a34a" stroke-width="1.5"/>

  <rect x="150" y="348" width="120" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="270" y="348" width="252" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="522" y="348" width="228" height="40" rx="10" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <g stroke="#ffffff" stroke-width="1" opacity="0.4">
    <line x1="210" y1="348" x2="210" y2="356"/>
    <line x1="330" y1="348" x2="330" y2="356"/>
    <line x1="390" y1="348" x2="390" y2="356"/>
    <line x1="450" y1="348" x2="450" y2="356"/>
    <line x1="510" y1="348" x2="510" y2="356"/>
    <line x1="570" y1="348" x2="570" y2="356"/>
    <line x1="690" y1="348" x2="690" y2="356"/>
  </g>
  <text x="210" y="373" font-size="13" fill="#1e3a8a" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">reach</text>
  <text x="396" y="373" font-size="13" fill="#166534" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">grasp</text>
  <text x="636" y="373" font-size="13" fill="#ffffff" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">lift</text>

  <!-- dim tail (40~49) -->
  <rect x="630" y="348" width="120" height="40" rx="10" fill="#94a3b8" opacity="0.42"/>

  <line x1="630" y1="342" x2="630" y2="394" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="150" y="404" font-size="11" fill="#64748b" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">0</text>
  <text x="630" y="404" font-size="11" fill="#64748b" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">40</text>
  <text x="750" y="404" font-size="11" fill="#64748b" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">50</text>

  <!-- progression arrow -->
  <line x1="160" y1="416" x2="720" y2="416" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="440" y="437" font-size="14" font-weight="600" fill="#16a34a" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">한 청크로 reach → grasp → lift 완주</text>

  <!-- after result -->
  <rect x="24" y="454" width="832" height="38" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="44" y="478" font-size="14" font-weight="600" fill="#166534" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">결과: shoulder_lift  -85.5° → 47.8°  (lift 진행)</text>
</svg>
