<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" role="img" aria-labelledby="ttl desc">
  <title id="ttl">데이터 위치 다양성과 암기</title>
  <desc id="desc">워크스페이스를 위에서 본 격자 두 개. 왼쪽은 grasp 위치가 한 칸에만 몰려(분산 0.059, WARN) 고정 자세를 암기하는 상태, 오른쪽은 격자 전역에 고르게 분산(분산 0.12 이상 목표, PASS)되어 위치를 따라가기를 학습하는 재수집 목표 상태.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- background card -->
  <rect x="0" y="0" width="880" height="500" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- title -->
  <text x="24" y="40" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="21" font-weight="700" fill="#0f172a">데이터 위치 다양성과 암기</text>
  <text x="24" y="62" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#64748b">위에서 본 워크스페이스 격자 (좌·중·우 × 근·원)</text>

  <!-- ===================== LEFT PANEL (before) ===================== -->
  <rect x="24" y="82" width="400" height="330" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="40" cy="105" r="5" fill="#dc2626"/>
  <text x="52" y="110" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="15" font-weight="700" fill="#dc2626">before · cube_v0</text>

  <!-- row labels -->
  <text x="86" y="174" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#64748b">원</text>
  <text x="86" y="252" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#64748b">근</text>

  <!-- memorized cell highlight -->
  <rect x="178" y="130" width="78" height="78" fill="#fee2e2"/>
  <text x="217" y="124" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="10" fill="#dc2626">수집된 위치</text>

  <!-- grid lines -->
  <rect x="100" y="130" width="234" height="156" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="178" y1="130" x2="178" y2="286" stroke="#e2e8f0"/>
  <line x1="256" y1="130" x2="256" y2="286" stroke="#e2e8f0"/>
  <line x1="100" y1="208" x2="334" y2="208" stroke="#e2e8f0"/>

  <!-- clustered grasp dots (red) -->
  <circle cx="210" cy="160" r="4" fill="#dc2626"/>
  <circle cx="225" cy="164" r="4" fill="#dc2626"/>
  <circle cx="214" cy="172" r="4" fill="#dc2626"/>
  <circle cx="205" cy="178" r="4" fill="#dc2626"/>
  <circle cx="228" cy="180" r="4" fill="#dc2626"/>
  <circle cx="218" cy="156" r="4" fill="#dc2626"/>
  <circle cx="220" cy="188" r="4" fill="#dc2626"/>

  <!-- a different cube position + memorized-grasp arrow -->
  <text x="295" y="232" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="10" fill="#64748b">새 위치</text>
  <rect x="288" y="240" width="14" height="14" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 2"/>
  <path d="M288,245 Q250,210 232,180" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrowR)"/>

  <!-- column labels -->
  <text x="139" y="306" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#64748b">좌</text>
  <text x="217" y="306" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#64748b">중</text>
  <text x="295" y="306" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#64748b">우</text>

  <!-- left desc -->
  <text x="224" y="332" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" fill="#1e293b">한 자리에만 수집 →</text>
  <text x="224" y="352" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" fill="#1e293b">pan -22° 한 점 암기</text>
  <rect x="149" y="362" width="150" height="22" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="224" y="377" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" font-weight="700" fill="#dc2626">분산 0.059 · WARN</text>
  <text x="224" y="401" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" font-weight="600" fill="#dc2626">→ 다른 위치면 옆을 잡음</text>

  <!-- ===================== RIGHT PANEL (after) ===================== -->
  <rect x="456" y="82" width="400" height="330" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="472" cy="105" r="5" fill="#16a34a"/>
  <text x="484" y="110" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="15" font-weight="700" fill="#16a34a">after · 재수집 목표</text>

  <!-- row labels -->
  <text x="518" y="174" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#64748b">원</text>
  <text x="518" y="252" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#64748b">근</text>

  <!-- full coverage fill -->
  <rect x="532" y="130" width="234" height="156" fill="#dcfce7"/>

  <!-- grid lines -->
  <rect x="532" y="130" width="234" height="156" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="610" y1="130" x2="610" y2="286" stroke="#bbf7d0"/>
  <line x1="688" y1="130" x2="688" y2="286" stroke="#bbf7d0"/>
  <line x1="532" y1="208" x2="766" y2="208" stroke="#bbf7d0"/>

  <!-- spread grasp dots (green) -->
  <circle cx="562" cy="160" r="4" fill="#16a34a"/>
  <circle cx="580" cy="178" r="4" fill="#16a34a"/>
  <circle cx="640" cy="162" r="4" fill="#16a34a"/>
  <circle cx="658" cy="176" r="4" fill="#16a34a"/>
  <circle cx="718" cy="160" r="4" fill="#16a34a"/>
  <circle cx="736" cy="178" r="4" fill="#16a34a"/>
  <circle cx="562" cy="238" r="4" fill="#16a34a"/>
  <circle cx="580" cy="256" r="4" fill="#16a34a"/>
  <circle cx="640" cy="240" r="4" fill="#16a34a"/>
  <circle cx="658" cy="254" r="4" fill="#16a34a"/>
  <circle cx="718" cy="238" r="4" fill="#16a34a"/>
  <circle cx="736" cy="256" r="4" fill="#16a34a"/>

  <!-- column labels -->
  <text x="571" y="306" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#64748b">좌</text>
  <text x="649" y="306" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#64748b">중</text>
  <text x="727" y="306" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#64748b">우</text>

  <!-- right desc -->
  <text x="656" y="332" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" fill="#1e293b">워크스페이스 전역 분산</text>
  <text x="656" y="352" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" fill="#1e293b">위치 따라 grasp 학습</text>
  <rect x="578" y="362" width="156" height="22" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="656" y="377" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" font-weight="700" fill="#16a34a">분산 ≥0.12 목표 · PASS</text>
  <text x="656" y="401" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" font-weight="600" fill="#16a34a">→ 새 위치도 중앙을 잡음</text>

  <!-- ===================== BOTTOM SUMMARY ===================== -->
  <rect x="24" y="430" width="832" height="50" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="206" y="461" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" font-weight="600" fill="#b91c1c">다양성 0 = 고정 자세 암기</text>
  <text x="437" y="448" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="11" fill="#64748b">재수집</text>
  <line x1="388" y1="456" x2="486" y2="456" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="672" y="461" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" font-weight="600" fill="#15803d">다양성 충분 = 위치 따라가기</text>
</svg>
