<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 475" width="100%" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Silent failure: 오류 없이(exit 0) 조용히 깨진다</title>
  <desc id="desc">데이터셋 로드, 정책 forward, env 200스텝 실행, 정상 종료(exit 0)로 이어지는 평가 파이프라인이 전 구간 초록(오류 없음)으로 통과하지만, 결과만 빨강 SR 0%로 깨지고 그 위로 7개의 주황색 균열 지점(variant 선택, form-factor mismatch, language 0%, image flip, 정규화 양식 차이, bf16 cast, OOM)이 어느 단계에서 조용히 어긋나는지 보여 준다.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="475" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- title + subtitle -->
  <text x="28" y="38" font-size="21" font-weight="700" fill="#0f172a" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">Silent failure: 오류 없이(exit 0) 조용히 깨진다</text>
  <text x="28" y="62" font-size="13" fill="#64748b" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">파이프라인은 전부 초록(무오류)인데 결과만 빨강입니다.</text>

  <!-- crack zone caption -->
  <text x="28" y="92" font-size="13" font-weight="600" fill="#d97706" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">조용히 묻힌 균열 7곳 ↓</text>

  <!-- connectors (crack -> stage) -->
  <line x1="115" y1="182" x2="115" y2="231" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowO)"/>
  <line x1="352" y1="182" x2="350" y2="231" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowO)"/>
  <line x1="585" y1="138" x2="585" y2="231" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowO)"/>

  <!-- crack boxes (orange) -->
  <!-- B1 cluster: 1 + 5 -->
  <g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">
    <rect x="35" y="100" width="160" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="115" y="116" font-size="12" fill="#92400e" text-anchor="middle">(1) variant 선택</text>
    <text x="115" y="131" font-size="11" fill="#b45309" text-anchor="middle">_base vs _finetuned</text>

    <rect x="35" y="144" width="160" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="115" y="168" font-size="12" fill="#92400e" text-anchor="middle">(5) 정규화 양식 차이</text>
  </g>

  <!-- B2 cluster: 2 3 6 4 -->
  <g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">
    <rect x="248" y="100" width="100" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="298" y="116" font-size="11" fill="#92400e" text-anchor="middle">(2) form-factor</text>
    <text x="298" y="131" font-size="10" fill="#b45309" text-anchor="middle">6→7 DoF</text>

    <rect x="356" y="100" width="100" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="406" y="116" font-size="11" fill="#92400e" text-anchor="middle">(3) language 0%</text>
    <text x="406" y="131" font-size="10" fill="#b45309" text-anchor="middle">task 비어있음</text>

    <rect x="248" y="144" width="100" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="298" y="168" font-size="12" fill="#92400e" text-anchor="middle">(6) bf16 cast</text>

    <rect x="356" y="144" width="100" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="406" y="168" font-size="12" fill="#92400e" text-anchor="middle">(4) image flip</text>
  </g>

  <!-- B3 cluster: 7 -->
  <g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">
    <rect x="505" y="100" width="160" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="585" y="116" font-size="12" fill="#92400e" text-anchor="middle">(7) OOM</text>
    <text x="585" y="131" font-size="11" fill="#b45309" text-anchor="middle">exit 137</text>
  </g>

  <!-- pipeline (green) -->
  <g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">
    <rect x="40" y="234" width="150" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="115" y="261" font-size="14" fill="#166534" text-anchor="middle">데이터셋 로드</text>
    <text x="115" y="280" font-size="12" fill="#16a34a" text-anchor="middle">정상</text>

    <rect x="250" y="234" width="200" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="350" y="261" font-size="14" fill="#166534" text-anchor="middle">정책 forward</text>
    <text x="350" y="280" font-size="12" fill="#16a34a" text-anchor="middle">정상</text>

    <rect x="510" y="234" width="150" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="585" y="261" font-size="13" fill="#166534" text-anchor="middle">env 200스텝 실행</text>
    <text x="585" y="280" font-size="12" fill="#16a34a" text-anchor="middle">정상</text>

    <rect x="700" y="234" width="150" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="775" y="261" font-size="13" fill="#166534" text-anchor="middle">정상 종료 (exit 0)</text>
    <text x="775" y="280" font-size="12" fill="#16a34a" text-anchor="middle">오류 없음</text>
  </g>

  <!-- pipeline arrows -->
  <line x1="192" y1="263" x2="245" y2="263" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="452" y1="263" x2="505" y2="263" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="662" y1="263" x2="695" y2="263" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- exit 0 -> result -->
  <line x1="775" y1="294" x2="731" y2="333" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- result banner (red) -->
  <g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">
    <rect x="150" y="336" width="580" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="440" y="372" font-size="24" font-weight="700" fill="#dc2626" text-anchor="middle">SR 0%</text>
    <text x="440" y="394" font-size="13" fill="#991b1b" text-anchor="middle">그런데 어디서 깨졌는지 신호가 없음</text>
  </g>

  <!-- legend -->
  <g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="12" fill="#475569">
    <rect x="60" y="442" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/>
    <text x="82" y="453">정상·오류 없음</text>
    <rect x="270" y="442" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="292" y="453">조용히 깨지는 균열</text>
    <rect x="520" y="442" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <text x="542" y="453">결과만 깨짐(신호 없음)</text>
  </g>
</svg>
