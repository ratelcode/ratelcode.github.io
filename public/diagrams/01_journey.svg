<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" role="img" aria-labelledby="ttl desc">
  <title id="ttl">SmolVLA SO-101 튜닝 여정 흐름도</title>
  <desc id="desc">왼쪽의 공개 정책 smolvla_base는 zero-shot에서 팔도 들지 못했고(SR 0), 가운데 6단계 튜닝(정규화 통계 교체, camera3 채움, 30ep 파인튜닝, 실행구간 10→40, 안전 가드 3층, RTC 비동기·속도)을 차례로 거쳐 오른쪽의 픽앤플레이스 완주와 RTC 24Hz에 도달했습니다. 남은 과제는 데이터 다양성입니다.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowOr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="440" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="32" y="40" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="21" font-weight="700" fill="#0f172a">SmolVLA SO-101 튜닝 여정</text>
  <text x="32" y="63" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="12.5" fill="#64748b">zero-shot 실패에서 픽앤플레이스 완주까지, 6단계 튜닝 지도</text>

  <!-- Left: problem (red) -->
  <rect x="24" y="138" width="155" height="130" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="101.5" y="172" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" fill="#1e293b">smolvla_base</text>
  <text x="101.5" y="193" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="12" fill="#64748b">공개 정책 · zero-shot</text>
  <text x="101.5" y="221" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" font-weight="700" fill="#dc2626">팔도 못 듦</text>
  <text x="101.5" y="241" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#dc2626">(SR 0)</text>

  <!-- Steps grid (blue) : left column 1-2-3, right column 4-5-6 -->
  <!-- 1 -->
  <rect x="210" y="90" width="185" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="302.5" y="120" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" fill="#1e293b">(1) 정규화 통계 교체</text>
  <text x="302.5" y="139" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="12" fill="#64748b">2편</text>
  <!-- 2 -->
  <rect x="210" y="170" width="185" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="302.5" y="200" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" fill="#1e293b">(2) camera3 채움</text>
  <text x="302.5" y="219" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="12" fill="#64748b">3편</text>
  <!-- 3 -->
  <rect x="210" y="250" width="185" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="302.5" y="280" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" fill="#1e293b">(3) 30ep 파인튜닝</text>
  <text x="302.5" y="299" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="12" fill="#64748b">4편</text>
  <!-- 4 -->
  <rect x="425" y="90" width="185" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="517.5" y="120" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" fill="#1e293b">(4) 실행구간 10→40</text>
  <text x="517.5" y="139" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="12" fill="#64748b">5편</text>
  <!-- 5 -->
  <rect x="425" y="170" width="185" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="517.5" y="200" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" fill="#1e293b">(5) 안전 가드 3층</text>
  <text x="517.5" y="219" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="12" fill="#64748b">6편</text>
  <!-- 6 -->
  <rect x="425" y="250" width="185" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="517.5" y="280" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" fill="#1e293b">(6) RTC 비동기·속도</text>
  <text x="517.5" y="299" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="12" fill="#64748b">7·8편</text>

  <!-- Right: success (green) -->
  <rect x="650" y="143" width="205" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="752.5" y="197" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="15" font-weight="700" fill="#166534">픽앤플레이스 완주</text>
  <text x="752.5" y="222" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" fill="#16a34a">RTC 24Hz</text>

  <!-- Bottom: remaining (orange) -->
  <rect x="210" y="350" width="560" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="490" y="385" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="15" font-weight="700" fill="#b45309">남은 과제 — 데이터 다양성 (9편)</text>

  <!-- Arrows -->
  <line x1="179" y1="184" x2="206" y2="126" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="302.5" y1="156" x2="302.5" y2="167" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="302.5" y1="236" x2="302.5" y2="247" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline fill="none" stroke="#64748b" stroke-width="2" points="395,283 410,283 410,123 422,123" marker-end="url(#arrow)"/>
  <line x1="517.5" y1="156" x2="517.5" y2="167" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="517.5" y1="236" x2="517.5" y2="247" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="611" y1="278" x2="648" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" points="752.5,263 752.5,332 490,332 490,348" marker-end="url(#arrowOr)"/>
</svg>
