<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" role="img" aria-labelledby="ttl desc">
  <title id="ttl">send 직전 3층 안전 가드</title>
  <desc id="desc">정책 raw 출력을 역정규화한 뒤 envelope 클립, per-step 상대목표 클램프, Present_Load 과부하 감시를 차례로 거쳐 모터로 전달하는 세로 파이프라인. 세 가드는 매 제어 스텝마다 반복된다.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="540" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="32" y="42" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="21" font-weight="700" fill="#0f172a">send 직전 3층 안전 가드</text>

  <!-- 반복 브래킷 (가드 (1)~(3)) -->
  <path d="M126,158 H114 V414 H126" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="92" y="286" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#64748b" text-anchor="middle" transform="rotate(-90 92 286)">매 제어 스텝마다 반복</text>

  <!-- 시작: 정책 raw 출력 -->
  <rect x="140" y="76" width="370" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="325" y="106" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">정책 raw 출력 (역정규화)</text>

  <line x1="325" y1="126" x2="325" y2="156" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- (1) envelope 클립 -->
  <rect x="140" y="158" width="370" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="325" y="184" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">(1) envelope 클립</text>
  <text x="325" y="206" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#334155" text-anchor="middle">시연 min~max 밖 차단</text>

  <line x1="325" y1="222" x2="325" y2="252" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- (2) per-step 상대목표 클램프 -->
  <rect x="140" y="254" width="370" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="325" y="280" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">(2) per-step 상대목표 클램프</text>
  <text x="325" y="302" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#334155" text-anchor="middle">한 스텝 이동량 제한 (120°/s ÷ Hz)</text>

  <line x1="325" y1="318" x2="325" y2="348" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- (3) Present_Load 과부하 감시 -->
  <rect x="140" y="350" width="370" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="325" y="376" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">(3) Present_Load 과부하 감시</text>
  <text x="325" y="398" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#334155" text-anchor="middle">초과 시 abort</text>

  <line x1="325" y1="414" x2="325" y2="444" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 끝: 모터 -->
  <rect x="140" y="446" width="370" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="325" y="476" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">모터 (SO-101)</text>

  <!-- 보조 라벨: 오프라인 선검증 -->
  <rect x="560" y="150" width="290" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="705" y="177" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">오프라인 선검증</text>
  <text x="705" y="199" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">elbow 명령 83.4%가</text>
  <text x="705" y="218" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">시연 범위 밖</text>
  <line x1="558" y1="190" x2="512" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
